<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Game Temple app icon: the home page's hero temple (src/features/Menu/HeroLogo.jsx), at rest, on a full blue square.
       iOS rounds the corners itself. To regenerate the PNG, see ios/GameTempleCast/make-app-icon.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8299ee" />
      <stop offset="1" stop-color="#3f5bd0" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="470" fill="url(#gloss)" />

  <!-- The hero logo's own 260x170 drawing, scaled up and centred -->
  <g transform="translate(-1 192) scale(3.9)">
    <!-- Temple -->
    <g fill="none" stroke="#fff" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M66 70 L130 36 L194 70 Z" />
      <rect x="62" y="70" width="136" height="9" rx="2.5" />
      <rect x="72" y="83" width="14" height="47" rx="3" />
      <rect x="174" y="83" width="14" height="47" rx="3" />
      <rect x="60" y="130" width="140" height="7" rx="2.5" />
      <rect x="52" y="141" width="156" height="7" rx="2.5" />
    </g>

    <!-- Star in the roof -->
    <path fill="#fff" d="M130 47 l3.2 6.6 7.2 1 -5.2 5 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.2 -5 7.2 -1 z" />

    <!-- Dice, with their shadows -->
    <ellipse cx="113" cy="128" rx="13" ry="2.6" fill="rgba(20,31,87,0.35)" />
    <ellipse cx="149" cy="128" rx="11" ry="2.4" fill="rgba(20,31,87,0.35)" />
    <rect x="100" y="102" width="26" height="26" rx="6" fill="#fff" />
    <g fill="#4a66d8">
      <circle cx="107" cy="109" r="2.3" />
      <circle cx="119" cy="109" r="2.3" />
      <circle cx="113" cy="115" r="2.3" />
      <circle cx="107" cy="121" r="2.3" />
      <circle cx="119" cy="121" r="2.3" />
    </g>
    <rect x="138" y="106" width="22" height="22" rx="5" fill="#fff" />
    <g fill="#4a66d8">
      <circle cx="144" cy="112" r="2" />
      <circle cx="149" cy="117" r="2" />
      <circle cx="154" cy="122" r="2" />
    </g>

    <!-- Playing card, tipped the way it rests on the home page -->
    <g transform="rotate(10 218 62)">
      <rect x="205" y="26" width="26" height="36" rx="4" fill="#fff" />
      <path fill="#ff6b8a" d="M218 50 c-6 -4.5 -8 -7.5 -8 -10 a3.6 3.6 0 0 1 8 -1.4 a3.6 3.6 0 0 1 8 1.4 c0 2.5 -2 5.5 -8 10 z" />
    </g>

    <!-- Game piece -->
    <g fill="#fff">
      <circle cx="34" cy="64" r="6" />
      <path d="M28 86 q6 -14 6 -16 q0 2 6 16 z" />
      <rect x="25" y="85" width="18" height="4" rx="2" />
    </g>

    <!-- Sparkles -->
    <path fill="#fff" d="M56 26 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" />
    <path fill="#ffd36e" d="M196 104 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 z" />
    <path fill="#fff" d="M162 16 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 z" />
    <path fill="#bfe6ff" d="M232 82 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 z" />
    <path fill="#ffd36e" d="M44 112 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 z" />
  </g>
</svg>
